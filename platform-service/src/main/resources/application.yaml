server:
  port: 8081

springdoc:
  paths-to-exclude: /api/v1/internal/**
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  application:
    name: platform-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

auth:
  token:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

internal:
  service:
    key: ${INTERNAL_SERVICE_KEY}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId:%X{traceId:--}] %logger{36} - %msg%n"

clients:
  ticketing-service:
    service-key: ${INTERNAL_SERVICE_KEY}
