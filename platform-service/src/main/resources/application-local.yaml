spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${PLATFORM_DB_HOST:localhost}:${PLATFORM_DB_PORT:5433}/${PLATFORM_DB_NAME:tikitaka_platform}
    username: ${PLATFORM_DB_USERNAME:platform}
    password: ${PLATFORM_DB_PASSWORD}
  data:
    redis:
      host: ${PLATFORM_REDIS_HOST:localhost}
      port: ${PLATFORM_REDIS_PORT:6380}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
