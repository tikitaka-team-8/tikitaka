name: tikitaka-local

services:
  # ─────────────────────────────────────────────
  # Applications
  # ─────────────────────────────────────────────

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: tikitaka-gateway
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      TZ: Asia/Seoul
    healthcheck:
      test: [CMD-SHELL, "wget --spider --quiet http://localhost:8000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - tikitaka-network

  platform-service:
    build:
      context: .
      dockerfile: platform-service/Dockerfile
    container_name: tikitaka-platform-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME}
      PLATFORM_DB_USERNAME: ${PLATFORM_DB_USERNAME}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-15m}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-14d}
      TZ: Asia/Seoul
    depends_on:
      platform-postgres:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget --spider --quiet http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - tikitaka-network

  ticketing-service:
    build:
      context: .
      dockerfile: ticketing-service/Dockerfile
    container_name: tikitaka-ticketing-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TICKETING_DB_NAME: ${TICKETING_DB_NAME}
      TICKETING_DB_USERNAME: ${TICKETING_DB_USERNAME}
      TICKETING_DB_PASSWORD: ${TICKETING_DB_PASSWORD}
      TZ: Asia/Seoul
    depends_on:
      ticketing-postgres:
        condition: service_healthy
      ticketing-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget --spider --quiet http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - tikitaka-network

  payment-notification-service:
    build:
      context: .
      dockerfile: payment-notification-service/Dockerfile
    container_name: tikitaka-payment-notification-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      TZ: Asia/Seoul
    depends_on:
      payment-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget --spider --quiet http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - tikitaka-network

  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────

  # Platform Service 전용 PostgreSQL
  platform-postgres:
    image: postgres:16.15-alpine
    container_name: tikitaka-platform-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${PLATFORM_DB_NAME}
      POSTGRES_USER: ${PLATFORM_DB_USERNAME}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - tikitaka-network

  # Ticketing Service 전용 PostgreSQL
  ticketing-postgres:
    image: postgres:16.15-alpine
    container_name: tikitaka-ticketing-postgres
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: ${TICKETING_DB_NAME}
      POSTGRES_USER: ${TICKETING_DB_USERNAME}
      POSTGRES_PASSWORD: ${TICKETING_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ticketing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - tikitaka-network

  # Payment & Notification Service 전용 PostgreSQL
  payment-postgres:
    image: postgres:16.15-alpine
    container_name: tikitaka-payment-postgres
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${PAYMENT_DB_USERNAME}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - tikitaka-network

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────

  # Platform Service 전용 Redis
  platform-redis:
    image: redis:7.2.14-alpine
    container_name: tikitaka-platform-redis
    ports:
      - "127.0.0.1:6380:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - platform-redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - tikitaka-network

  # Ticketing Service 전용 Redis
  ticketing-redis:
    image: redis:7.2.14-alpine
    container_name: tikitaka-ticketing-redis
    ports:
      - "127.0.0.1:6381:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - ticketing-redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - tikitaka-network

  # Platform/Ticketing Redis 데이터 확인 UI
  redisinsight:
    image: redis/redisinsight:3.2.0
    container_name: tikitaka-redisinsight
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      platform-redis:
        condition: service_healthy
      ticketing-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tikitaka-network

  # ─────────────────────────────────────────────
  # Kafka
  # ─────────────────────────────────────────────

  # 단일 노드 KRaft 모드 Kafka
  kafka:
    image: apache/kafka:3.9.1
    container_name: tikitaka-kafka
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # 컨테이너 내부 통신과 호스트 접근을 위한 리스너 분리
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      # 로컬 단일 노드 환경에 맞춰 복제 수를 1로 설정
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - tikitaka-network

  # Kafka 관리 UI (Kafbat UI)
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: tikitaka-kafka-ui
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tikitaka-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet http://localhost:8080/actuator/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - tikitaka-network

  # ─────────────────────────────────────────────
  # Monitoring
  # ─────────────────────────────────────────────

  # Spring Actuator 메트릭 수집 및 저장
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: tikitaka-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet http://localhost:9090/-/healthy
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - tikitaka-network

  # Prometheus 메트릭 시각화
  grafana:
    image: grafana/grafana:12.1.0
    container_name: tikitaka-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana

      # Prometheus 데이터소스 자동 등록
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet http://localhost:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - tikitaka-network

# ─────────────────────────────────────────────
# Volumes & Networks
# ─────────────────────────────────────────────
volumes:
  platform-postgres-data:
  ticketing-postgres-data:
  payment-postgres-data:
  platform-redis-data:
  ticketing-redis-data:
  redisinsight-data:
  kafka-data:
  prometheus-data:
  grafana-data:

networks:
  tikitaka-network:
    name: tikitaka-network
    driver: bridge
