# 테스트 환경에서만 사용하는 추가 설정
# 기본 docker-compose.yml에 이 파일을 함께 적용하여 실행
#
# 실행 예시:
# docker compose -f docker-compose.yml -f docker-compose.test.yml up -d

services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: tikitaka-toxiproxy
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:18082:18082"
    restart: unless-stopped
    networks:
      - tikitaka-network

  gateway:
    environment:
      # HTTP 요청 처리 시간의 p95·p99를 Prometheus/Grafana에서 확인하기 위한 Histogram 활성화
      SPRING_APPLICATION_JSON: '{"management":{"metrics":{"distribution":{"percentiles-histogram":{"http.server.requests":true}}}}}'

  platform-service:
    environment:
      # HTTP 요청 처리 시간의 p95·p99를 Prometheus/Grafana에서 확인하기 위한 Histogram 활성화
      SPRING_APPLICATION_JSON: '{"management":{"metrics":{"distribution":{"percentiles-histogram":{"http.server.requests":true}}}}}'

  ticketing-service:
    environment:
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
      # HTTP Histogram은 항상 활성화하고, S05 환경변수가 있을 때만 Payment 주소·Feign Timeout이 테스트 값으로 바뀐
      # JSON으로 paymentCreationClient Map key를 보존함
      SPRING_APPLICATION_JSON: >-
        {"management":{"metrics":{"distribution":{"percentiles-histogram":{"http.server.requests":true}}}},"clients":{"payment-notification-service":{"url":"${S05_PAYMENT_SERVICE_URL:-http://payment-notification-service:8083}"}},"spring":{"cloud":{"openfeign":{"client":{"config":{"paymentCreationClient":{"connectTimeout":${S05_PAYMENT_CONNECT_TIMEOUT:-1000},"readTimeout":${S05_PAYMENT_READ_TIMEOUT:-60000}}}}}}}}

      # Ticketing Service의 Kafka Consumer 실행 여부
      # 기본값: true (Consumer 정상 실행)
      # false로 설정하면 Consumer를 시작하지 않아 Kafka Consumer 장애 상황을 테스트할 수 있음
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: ${TICKETING_KAFKA_LISTENER_AUTO_STARTUP:-true}

      # S08 Reservation Consumer 장애·복구 테스트용 Listener 실행 여부
      RESERVATION_KAFKA_CONSUMER_AUTO_STARTUP: ${RESERVATION_KAFKA_CONSUMER_AUTO_STARTUP:-true}

  payment-notification-service:
    environment:
      # HTTP 요청 처리 시간의 p95·p99를 Prometheus/Grafana에서 확인하기 위한 Histogram 활성화
      SPRING_APPLICATION_JSON: '{"management":{"metrics":{"distribution":{"percentiles-histogram":{"http.server.requests":true}}}}}'

      # Payment & Notification Service의 Kafka Consumer 실행 여부
      # 기본값: true (Consumer 정상 실행)
      # false로 설정하면 Consumer를 시작하지 않아 Kafka Consumer 장애 상황을 테스트할 수 있음
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: ${PAYMENT_KAFKA_LISTENER_AUTO_STARTUP:-true}

      # S08 Notification Consumer 장애·복구 테스트용 Listener 실행 여부
      NOTIFICATION_KAFKA_CONSUMER_AUTO_STARTUP: ${NOTIFICATION_KAFKA_CONSUMER_AUTO_STARTUP:-true}
