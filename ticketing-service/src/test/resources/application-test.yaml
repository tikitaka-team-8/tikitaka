spring:
  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

internal:
  service:
    key: internal-service-key-for-tests

clients:
  platform-service:
    url: http://localhost:8081
    service-key: platform-internal-service-key-for-tests
  payment-notification-service:
    url: http://localhost:8083
    service-key: platform-internal-service-key-for-tests
