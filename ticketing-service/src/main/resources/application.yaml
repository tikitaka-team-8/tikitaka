server:
  port: 8082

springdoc:
  paths-to-exclude: /api/v1/internal/**
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  application:
    name: ticketing-service
  cloud:
    openfeign:
      client:
        config:
          platformSalesStatusClient:
            connectTimeout: 1000
            readTimeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ticketing-payment-group
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true


queue:
  admission-token-ttl: PT3M
  retention-after-sales-close: PT1H
  admission-batch-size: 50
  expiration-batch-size: 50
  waiting-heartbeat-timeout: PT2M
  admission-interval: PT1S

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

clients:
  platform-service:
    service-key: ${INTERNAL_SERVICE_KEY}
  payment-notification-service:
    service-key: ${INTERNAL_SERVICE_KEY}

internal:
  service:
    key: ${INTERNAL_SERVICE_KEY}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId:%X{traceId:--}] %logger{36} - %msg%n"

reservation:
  kafka:
    consumer:
      auto-startup: ${RESERVATION_KAFKA_CONSUMER_AUTO_STARTUP:true}
