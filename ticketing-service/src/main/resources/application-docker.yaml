spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${TICKETING_DB_HOST:ticketing-postgres}:${TICKETING_DB_PORT:5432}/${TICKETING_DB_NAME:tikitaka_ticketing}
    username: ${TICKETING_DB_USERNAME:ticketing}
    password: ${TICKETING_DB_PASSWORD}
  data:
    redis:
      host: ${TICKETING_REDIS_HOST:ticketing-redis}
      port: ${TICKETING_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:19092}
