spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5435/${PAYMENT_DB_NAME}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
  kafka:
    bootstrap-servers: localhost:9092

clients:
  ticketing-service:
    url: http://localhost:8082

payment:
  provider: toss
  toss:
    secret-key: ${TOSS_SECRET_KEY}