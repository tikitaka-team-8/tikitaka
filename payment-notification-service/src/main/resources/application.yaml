server:
  port: 8083

spring:
  application:
    name: payment-notification-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
internal:
  service:
    key: ${INTERNAL_SERVICE_KEY}
payment:
  outbox:
    publish-delay-ms: 1000
