server:
  port: 8083

spring:
  application:
    name: payment-notification-service
  kafka:
    consumer:
      group-id: notification-reservation-group
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
internal:
  service:
    key: ${INTERNAL_SERVICE_KEY}
payment:
  outbox:
    publish-delay-ms: 1000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId:%X{traceId:--}] %logger{36} - %msg%n"
