server:
  port: 8083

springdoc:
  paths-to-exclude: /api/v1/internal/**
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  application:
    name: payment-notification-service

  cloud:
    openfeign:
      client:
        config:
          tossPaymentsClient:
            connectTimeout: 3000
            readTimeout: 5000

  kafka:
    consumer:
      group-id: notification-reservation-group
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

internal:
  service:
    key: ${INTERNAL_SERVICE_KEY}

payment:
  provider: ${PAYMENT_PROVIDER:mock}

  outbox:
    publish-delay-ms: 1000

  reconciliation:
    processing-delay-ms: 60000
    processing-timeout-minutes: 5

  toss:
    base-url: https://api.tosspayments.com
    secret-key: ${TOSS_SECRET_KEY:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId:%X{traceId:--}] %logger{36} - %msg%n"
notification:
  kafka:
    consumer:
      auto-startup: ${NOTIFICATION_KAFKA_CONSUMER_AUTO_STARTUP:true}
