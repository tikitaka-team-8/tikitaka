<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tikitaka Toss Test</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="config.js"></script>
</head>
<body>
<main>
  <h1>Tikitaka Toss 테스트 결제</h1>
  <div class="summary">
    <div>orderId <code id="orderId"></code></div>
    <div>amount <strong id="amount"></strong></div>
  </div>
  <div id="payment-method"></div>
  <div id="agreement"></div>
  <button id="pay" disabled>테스트 결제하기</button>
  <p id="message"></p>
</main>
<script>
(async () => {
  const c = window.TIKITAKA_CONFIG;
  document.querySelector("#orderId").textContent = c.orderId;
  document.querySelector("#amount").textContent =
      new Intl.NumberFormat("ko-KR").format(c.amount) + "원";

  const message = document.querySelector("#message");
  if (!c.clientKey || c.clientKey.includes("여기에_")) {
    message.textContent = "config.js에 Toss 테스트 Client Key(test_gck_...)를 입력하세요.";
    return;
  }

  try {
    const tossPayments = TossPayments(c.clientKey);
    const widgets = tossPayments.widgets({ customerKey: TossPayments.ANONYMOUS });
    await widgets.setAmount({ currency: "KRW", value: c.amount });

    await Promise.all([
      widgets.renderPaymentMethods({ selector: "#payment-method", variantKey: "DEFAULT" }),
      widgets.renderAgreement({ selector: "#agreement", variantKey: "AGREEMENT" })
    ]);

    const btn = document.querySelector("#pay");
    btn.disabled = false;
    btn.addEventListener("click", async () => {
      try {
        await widgets.requestPayment({
          orderId: c.orderId,
          orderName: c.orderName,
          successUrl: location.origin + "/success.html",
          failUrl: location.origin + "/fail.html",
          customerEmail: "customer123@gmail.com",
          customerName: "김토스",
          customerMobilePhone: "01012341234"
        });
      } catch (e) {
        message.textContent = e.message || String(e);
      }
    });
  } catch (e) {
    message.textContent = e.message || String(e);
  }
})();
</script>
</body>
</html>
