<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tikitaka Toss Test</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="config.js"></script>
</head>

<body>
<main>
  <h1>Tikitaka Toss 테스트 결제</h1>

  <div class="summary">
    <div>
      orderId
      <input id="orderId" type="text" placeholder="PAY-...">
    </div>

    <div>
      amount
      <input id="amount" type="number" min="1" placeholder="150000">
    </div>
  </div>

  <div id="payment-method"></div>
  <div id="agreement"></div>

  <button id="pay" disabled>
    테스트 결제하기
  </button>

  <p id="message"></p>
</main>

<script>
  (async () => {
    const config = window.TIKITAKA_CONFIG;

    const orderIdInput = document.querySelector("#orderId");
    const amountInput = document.querySelector("#amount");
    const message = document.querySelector("#message");
    const payButton = document.querySelector("#pay");

    // config.js 값이 있으면 기본값으로 표시
    orderIdInput.value = config.orderId || "";
    amountInput.value = config.amount || "";

    // Client Key 확인
    if (
            !config.clientKey ||
            config.clientKey.includes("여기에_")
    ) {
      message.textContent =
              "config.js에 Toss 테스트 Client Key(test_gck_...)를 입력하세요.";
      return;
    }

    try {
      const tossPayments = TossPayments(config.clientKey);

      const widgets = tossPayments.widgets({
        customerKey: TossPayments.ANONYMOUS
      });

      // Toss 결제 위젯은 처음 렌더링할 때 amount가 필요함
      const initialAmount = Number(amountInput.value);

      if (!initialAmount || initialAmount <= 0) {
        message.textContent =
                "amount를 입력한 뒤 페이지를 새로고침해주세요.";
        return;
      }

      await widgets.setAmount({
        currency: "KRW",
        value: initialAmount
      });

      await Promise.all([
        widgets.renderPaymentMethods({
          selector: "#payment-method",
          variantKey: "DEFAULT"
        }),

        widgets.renderAgreement({
          selector: "#agreement",
          variantKey: "AGREEMENT"
        })
      ]);

      payButton.disabled = false;

      payButton.addEventListener("click", async () => {
        try {
          const orderId = orderIdInput.value.trim();
          const amount = Number(amountInput.value);

          if (!orderId) {
            message.textContent =
                    "orderId를 입력해주세요.";
            return;
          }

          if (!amount || amount <= 0) {
            message.textContent =
                    "amount를 올바르게 입력해주세요.";
            return;
          }

          // 입력된 금액으로 갱신
          await widgets.setAmount({
            currency: "KRW",
            value: amount
          });

          await widgets.requestPayment({
            orderId: orderId,
            orderName:
                    config.orderName || "Tikitaka 테스트 결제",

            successUrl:
                    location.origin + "/success.html",

            failUrl:
                    location.origin + "/fail.html",

            customerEmail:
                    "customer123@gmail.com",

            customerName:
                    "김토스",

            customerMobilePhone:
                    "01012341234"
          });

        } catch (error) {
          console.error(error);

          message.textContent =
                  error.message || String(error);
        }
      });

    } catch (error) {
      console.error(error);

      message.textContent =
              error.message || String(error);
    }
  })();
</script>

</body>
</html>
