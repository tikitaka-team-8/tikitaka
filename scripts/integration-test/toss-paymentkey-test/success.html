<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><title>인증 성공</title>
<link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>결제 인증 성공 ✅</h1>
<p>아직 우리 Payment 승인 API는 호출하지 않았습니다.</p>
<label>paymentKey</label><textarea id="paymentKey" readonly></textarea>
<button id="copy">paymentKey 복사</button>
<label>orderId</label><code id="orderId"></code>
<label>amount</label><strong id="amount"></strong>
<p>이 paymentKey를 Postman의 <code>paymentKey</code> 변수에 넣고 우리 approve API를 호출하세요.</p>
</main>
<script>
const p = new URLSearchParams(location.search);
const key = p.get("paymentKey") || "";
document.querySelector("#paymentKey").value = key;
document.querySelector("#orderId").textContent = p.get("orderId") || "";
const amount = p.get("amount");
document.querySelector("#amount").textContent =
  amount ? new Intl.NumberFormat("ko-KR").format(Number(amount)) + "원" : "";
document.querySelector("#copy").onclick = async () => {
  await navigator.clipboard.writeText(key);
  document.querySelector("#copy").textContent = "복사 완료!";
};
</script></body></html>
