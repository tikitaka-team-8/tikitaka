<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><title>인증 실패</title>
<link rel="stylesheet" href="style.css"></head>
<body><main><h1>결제 인증 실패 ❌</h1><pre id="result"></pre></main>
<script>
const p = new URLSearchParams(location.search);
document.querySelector("#result").textContent = JSON.stringify({
  code:p.get("code"), message:p.get("message"), orderId:p.get("orderId")
}, null, 2);
</script></body></html>
