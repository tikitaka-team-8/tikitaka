spring:
  config:
    activate:
      on-profile: docker

services:
  platform:
    url: http://platform-service:8081
  ticketing:
    url: http://ticketing-service:8082
  payment-notification:
    url: http://payment-notification-service:8083

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: Platform Service
        url: /openapi/platform
      - name: Ticketing Service
        url: /openapi/ticketing
      - name: Payment & Notification Service
        url: /openapi/payment-notification
