# docker compose -f docker-compose.yml -f infra/compose.baseline.yml ...
# BASELINE_REVISION에는 실제 빌드 소스의 git HEAD를 설정한다.
services:
  ticketing-service:
    image: tikitaka-ticketing-baseline:${BASELINE_REVISION:?Set BASELINE_REVISION to git HEAD}
    build:
      labels:
        org.opencontainers.image.revision: ${BASELINE_REVISION}
    environment:
      SPRING_APPLICATION_JSON: '{"management":{"metrics":{"distribution":{"percentiles-histogram":{"http.server.requests":true}}}}}'
  platform-service:
    image: tikitaka-platform-baseline:${BASELINE_REVISION:?Set BASELINE_REVISION to git HEAD}
    build:
      labels:
        org.opencontainers.image.revision: ${BASELINE_REVISION}
    environment:
      SPRING_APPLICATION_JSON: '{"management":{"metrics":{"distribution":{"percentiles-histogram":{"http.server.requests":true}}}}}'
