name: Happy Path Integration Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-happy-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: Gateway 경유 통합 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: tikitaka-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PLATFORM_DB_NAME: tikitaka_platform_ci
      PLATFORM_DB_USERNAME: platform_ci
      PLATFORM_DB_PASSWORD: platform_ci_only_password
      TICKETING_DB_NAME: tikitaka_ticketing_ci
      TICKETING_DB_USERNAME: ticketing_ci
      TICKETING_DB_PASSWORD: ticketing_ci_only_password
      PAYMENT_DB_NAME: tikitaka_payment_ci
      PAYMENT_DB_USERNAME: payment_ci
      PAYMENT_DB_PASSWORD: payment_ci_only_password
      GRAFANA_ADMIN_USERNAME: admin
      GRAFANA_ADMIN_PASSWORD: grafana_ci_only_password

    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v7

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 실행 전용 인증값 생성
        shell: bash
        run: |
          set -euo pipefail

          jwt_secret="$(openssl rand -base64 48 | tr -d '\n')"
          internal_service_key="$(openssl rand -hex 32)"

          echo "::add-mask::${jwt_secret}"
          echo "::add-mask::${internal_service_key}"
          echo "JWT_SECRET=${jwt_secret}" >> "$GITHUB_ENV"
          echo "INTERNAL_SERVICE_KEY=${internal_service_key}" >> "$GITHUB_ENV"

      - name: 애플리케이션 이미지 빌드
        run: docker compose build gateway platform-service ticketing-service payment-notification-service

      - name: PostgreSQL Redis Kafka 기동
        run: |
          docker compose up -d --wait --wait-timeout 120 \
            platform-postgres \
            platform-redis \
            ticketing-postgres \
            ticketing-redis \
            payment-postgres \
            kafka

      - name: Platform Ticketing Payment 기동
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180 \
            platform-service \
            ticketing-service \
            payment-notification-service

      - name: Platform 테스트 데이터 준비
        shell: bash
        run: |
          docker compose exec -T platform-postgres \
            psql -v ON_ERROR_STOP=1 \
              -U "$PLATFORM_DB_USERNAME" \
              -d "$PLATFORM_DB_NAME" \
            < scripts/integration-test/seed/platform-seed.sql

      - name: Ticketing 테스트 데이터 준비
        shell: bash
        run: |
          docker compose exec -T ticketing-postgres \
            psql -v ON_ERROR_STOP=1 \
              -U "$TICKETING_DB_USERNAME" \
              -d "$TICKETING_DB_NAME" \
            < scripts/integration-test/seed/ticketing-seed.sql

      - name: Gateway 기동
        run: docker compose up -d --no-build --wait --wait-timeout 120 gateway

      - name: 보안 시나리오와 Happy Path 실행
        id: happy_path
        shell: bash
        env:
          TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GATEWAY_URL: http://localhost:8000
        run: |
          mkdir -p integration-test-artifacts
          set -o pipefail
          bash scripts/integration-test/run.sh 2>&1 | tee integration-test-artifacts/scenario.log

      - name: Ticketing 최종 상태 확인
        shell: bash
        env:
          RESERVATION_ID: ${{ steps.happy_path.outputs.reservation_id }}
          SEAT_HOLD_ID: ${{ steps.happy_path.outputs.seat_hold_id }}
          SCHEDULE_SEAT_ID: ${{ steps.happy_path.outputs.schedule_seat_id }}
        run: |
          set -euo pipefail

          actual_state="$(docker compose exec -T ticketing-postgres \
            psql -v ON_ERROR_STOP=1 \
              -v reservation_id="$RESERVATION_ID" \
              -v seat_hold_id="$SEAT_HOLD_ID" \
              -v schedule_seat_id="$SCHEDULE_SEAT_ID" \
              -U "$TICKETING_DB_USERNAME" \
              -d "$TICKETING_DB_NAME" \
              --tuples-only \
              --no-align \
            < scripts/integration-test/verify-ticketing-state.sql \
            | tr -d '[:space:]')"

          expected_state="CONFIRMED|CONFIRMED|SOLD"
          if [[ "$actual_state" != "$expected_state" ]]; then
            printf '[FAIL] Ticketing 최종 상태 불일치: expected=%s, actual=%s\n' \
              "$expected_state" "${actual_state:-ROW_NOT_FOUND}" >&2
            exit 1
          fi

          printf '[OK] Reservation=%s, SeatHold=%s, ScheduleSeat=%s\n' \
            CONFIRMED CONFIRMED SOLD

      - name: Reservation Outbox 최종 상태 확인
        shell: bash
        env:
          RESERVATION_ID: ${{ steps.happy_path.outputs.reservation_id }}
        run: |
          set -euo pipefail

          actual_state="$(docker compose exec -T ticketing-postgres \
            psql -v ON_ERROR_STOP=1 \
              -v reservation_id="$RESERVATION_ID" \
              -U "$TICKETING_DB_USERNAME" \
              -d "$TICKETING_DB_NAME" \
              --tuples-only \
              --no-align \
            < scripts/integration-test/verify-ticketing-event-state.sql \
            | tr -d '[:space:]')"

          expected_state="1|1"
          if [[ "$actual_state" != "$expected_state" ]]; then
            printf '[FAIL] Reservation Outbox 최종 상태 불일치: expected=%s, actual=%s\n' \
              "$expected_state" "${actual_state:-ROW_NOT_FOUND}" >&2
            exit 1
          fi

          printf '[OK] Reservation Outbox=%s, Published=%s\n' 1 1

      - name: Payment Notification 최종 상태 확인
        shell: bash
        env:
          RESERVATION_ID: ${{ steps.happy_path.outputs.reservation_id }}
          RESERVATION_NUMBER: ${{ steps.happy_path.outputs.reservation_number }}
          PAYMENT_ID: ${{ steps.happy_path.outputs.payment_id }}
          NOTIFICATION_ID: ${{ steps.happy_path.outputs.notification_id }}
        run: |
          set -euo pipefail

          actual_state="$(docker compose exec -T payment-postgres \
            psql -v ON_ERROR_STOP=1 \
              -v reservation_id="$RESERVATION_ID" \
              -v reservation_number="$RESERVATION_NUMBER" \
              -v payment_id="$PAYMENT_ID" \
              -v notification_id="$NOTIFICATION_ID" \
              -U "$PAYMENT_DB_USERNAME" \
              -d "$PAYMENT_DB_NAME" \
              --tuples-only \
              --no-align \
            < scripts/integration-test/verify-payment-notification-state.sql \
            | tr -d '[:space:]')"

          expected_state="APPROVED|1|1|1|READ|VIEWED|1"
          if [[ "$actual_state" != "$expected_state" ]]; then
            printf '[FAIL] Payment Notification 최종 상태 불일치: expected=%s, actual=%s\n' \
              "$expected_state" "${actual_state:-ROW_NOT_FOUND}" >&2
            exit 1
          fi

          printf '[OK] Payment=%s, PaymentOutbox=%s, Notification=%s, NotificationInbox=%s\n' \
            APPROVED PUBLISHED READ PROCESSED

      - name: 실패 진단 자료 수집
        if: failure()
        shell: bash
        run: |
          mkdir -p integration-test-artifacts
          docker compose ps --all > integration-test-artifacts/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps gateway > integration-test-artifacts/gateway.log 2>&1 || true
          docker compose logs --no-color --timestamps platform-service > integration-test-artifacts/platform-service.log 2>&1 || true
          docker compose logs --no-color --timestamps ticketing-service > integration-test-artifacts/ticketing-service.log 2>&1 || true
          docker compose logs --no-color --timestamps payment-notification-service > integration-test-artifacts/payment-notification-service.log 2>&1 || true
          docker compose logs --no-color --timestamps platform-postgres > integration-test-artifacts/platform-postgres.log 2>&1 || true
          docker compose logs --no-color --timestamps ticketing-postgres > integration-test-artifacts/ticketing-postgres.log 2>&1 || true
          docker compose logs --no-color --timestamps payment-postgres > integration-test-artifacts/payment-postgres.log 2>&1 || true
          docker compose logs --no-color --timestamps platform-redis ticketing-redis kafka > integration-test-artifacts/infrastructure.log 2>&1 || true
          docker compose exec -T ticketing-postgres \
            psql -U "$TICKETING_DB_USERNAME" -d "$TICKETING_DB_NAME" \
              --command="SELECT event_id, reservation_id, event_type, status, created_at, published_at FROM p_reservation_outbox ORDER BY created_at DESC LIMIT 20;" \
            > integration-test-artifacts/reservation-outbox.txt 2>&1 || true
          docker compose exec -T payment-postgres \
            psql -U "$PAYMENT_DB_USERNAME" -d "$PAYMENT_DB_NAME" \
              --command="SELECT outbox_id, payment_id, event_type, status, retry_count, created_at, published_at FROM p_payment_outbox ORDER BY created_at DESC LIMIT 20;" \
            > integration-test-artifacts/payment-outbox.txt 2>&1 || true
          docker compose exec -T payment-postgres \
            psql -U "$PAYMENT_DB_USERNAME" -d "$PAYMENT_DB_NAME" \
              --command="SELECT event_id, reservation_id, event_type, processed_at FROM p_notification_inbox ORDER BY processed_at DESC LIMIT 20;" \
            > integration-test-artifacts/notification-inbox.txt 2>&1 || true
          docker compose exec -T payment-postgres \
            psql -U "$PAYMENT_DB_USERNAME" -d "$PAYMENT_DB_NAME" \
              --command="SELECT notification_id, source_event_id, user_id, reservation_id, reservation_number, notification_type, read_status, last_viewed_at, created_at FROM p_notification ORDER BY created_at DESC LIMIT 20;" \
            > integration-test-artifacts/notifications.txt 2>&1 || true

      - name: 실패 진단 자료 보존
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: integration-test-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: CI 컨테이너와 데이터 정리
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 10
