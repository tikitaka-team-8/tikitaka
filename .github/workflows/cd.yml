name: Deploy ECS

# develop 브랜치 반영 시 ECR 이미지 게시 및 ECS 스테이징 배포 실행
on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  # AWS OIDC 인증을 위한 GitHub ID 토큰 발급 권한
  id-token: write

jobs:
  # ────────────────────────────
  # 1. 서비스별 이미지 빌드 및 ECR 게시
  # ────────────────────────────
  publish:
    if: github.ref == 'refs/heads/develop'
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - platform-service
          - ticketing-service
          - payment-notification-service
    env:
      AWS_REGION: ap-northeast-2
      REPOSITORY: tikitaka/staging/${{ matrix.service }}
      # develop 커밋 SHA 기반 이미지 태그 사용
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 저장소 변수 누락 시 AWS 인증 전에 중단
      - name: Check publisher role configuration
        env:
          PUBLISHER_ROLE_ARN: ${{ vars.STAGING_IMAGE_PUBLISHER_ROLE_ARN }}
        run: |
          test -n "$PUBLISHER_ROLE_ARN" || { echo 'Set the STAGING_IMAGE_PUBLISHER_ROLE_ARN repository variable.' >&2; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.STAGING_IMAGE_PUBLISHER_ROLE_ARN }}
          role-session-name: staging-images-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # 동일 커밋 이미지가 있으면 빌드 및 게시 생략
      - name: Check whether image already exists
        id: image
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" > /dev/null 2> "$RUNNER_TEMP/ecr-describe-error"; then
            echo 'already_exists=true' >> "$GITHUB_OUTPUT"
          elif grep -q 'ImageNotFoundException' "$RUNNER_TEMP/ecr-describe-error"; then
            echo 'already_exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/ecr-describe-error" >&2
            exit 1
          fi

      - name: Login to Amazon ECR
        if: steps.image.outputs.already_exists == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 서비스 Dockerfile로 빌드한 이미지를 ECR에 게시
      - name: Build and push image
        if: steps.image.outputs.already_exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build -f "${{ matrix.service }}/Dockerfile" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Report image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          if [ -n "$REGISTRY" ]; then
            echo "$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$REPOSITORY:$IMAGE_TAG already exists in ECR" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ────────────────────────────
  # 2. ECS 서비스 순차 배포
  # ────────────────────────────
  deploy:
    if: github.ref == 'refs/heads/develop'
    needs: publish
    name: Deploy staging services
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 동일 ECS 환경의 동시 배포 방지
    concurrency:
      group: staging-ecs-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-2
      IMAGE_TAG: ${{ github.sha }}
      STAGING_CLUSTER: tikitaka-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 배포 전용 OIDC 역할 ARN 확인
      - name: Check deployer role configuration
        env:
          DEPLOYER_ROLE_ARN: ${{ vars.STAGING_DEPLOYER_ROLE_ARN }}
        run: |
          test -n "$DEPLOYER_ROLE_ARN" || { echo 'Set the STAGING_DEPLOYER_ROLE_ARN repository variable.' >&2; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.STAGING_DEPLOYER_ROLE_ARN }}
          role-session-name: staging-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # 게시 이미지 기반 ECS 스테이징 배포 스크립트 실행
      - name: Deploy published images
        run: bash scripts/deployment/staging-app/deploy.sh
